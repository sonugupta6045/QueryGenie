version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: querygenie-postgres
    environment:
      POSTGRES_DB: querygenie_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: querygenie-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
